<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>事故状況の入力支援・分析</title>
<style>
:root{--fg:#1f2328;--muted:#5b6370;--line:#d9dde3;--bg:#fff;--soft:#f6f7f9;--accent:#3d5af1;--accent-d:#2c46d6;--warn-bg:#fdf7dc;--ok:#1a7f37;--ng:#b42318;--chip:#eef1ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--fg);background:var(--bg);line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:28px;margin:4px 0 18px}
h2{font-size:21px;margin:26px 0 12px}
h3{font-size:16px;margin:20px 0 8px}
nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
nav a{color:#1a36c7}
nav a.on{font-weight:700;text-decoration:none;border-bottom:2px solid var(--accent)}
nav .right{margin-left:auto;font-size:13px;color:var(--muted)}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 18px;border-radius:6px;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--accent-d)}
.btn.o{background:#fff;color:var(--accent)}
.btn.o:hover{background:var(--chip)}
.btn.danger{background:#a8261c;border-color:#a8261c}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{padding:14px 26px;font-size:17px}
.notice{background:var(--warn-bg);padding:12px 16px;border-radius:6px;margin:10px 0 18px}
.flash{background:#e8f3ec;border:1px solid #b7dcc4;padding:10px 14px;border-radius:6px;margin-bottom:14px}
.flash.err{background:#fdecea;border-color:#f3b8b1}
textarea,input[type=text],input[type=number],input[type=password],select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;max-width:100%}
textarea{width:100%;min-height:150px}
textarea:focus,input:focus,select:focus{outline:3px solid #a9c4f5;border-color:#7aa3ec}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;text-align:left}
th{background:var(--soft);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:#fff}
.card h3{margin-top:0}
.menu-card{display:block;color:inherit;text-decoration:none}
.menu-card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(61,90,241,.12)}
.st{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#eceff3;white-space:nowrap}
.st-原文明記{background:#e3f4e8;color:#165c2a}
.st-規則で補完{background:#e6efff;color:#1d3f9c}
.st-規則で候補（要確認）,.st-要約（要確認）,.st-推定（要確認）{background:#fff1d6;color:#7a4b00}
.st-検証で除外{background:#fde4e1;color:#8c1d13}
.tabs{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.tabs label{border:1px solid var(--line);padding:6px 14px;border-radius:20px;cursor:pointer}
.tabs input{display:none}
.tabs input:checked+span{font-weight:700;color:var(--accent)}
.tplgrid{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;align-items:center}
.tplgrid label{font-weight:600}
.hint{background:#f1f4ff;border-left:4px solid var(--accent);padding:10px 14px;border-radius:4px;margin:12px 0}
.bar{height:10px;background:#eceff3;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.rec{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.rec table th{width:160px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto}
.heat td{text-align:center;font-size:12px;min-width:46px;padding:4px}
.heat th{font-size:12px;font-weight:500;white-space:nowrap}
.heat th.v{writing-mode:vertical-rl;height:150px;vertical-align:bottom}
details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:10px 0}
summary{cursor:pointer;font-weight:600}
code{background:var(--soft);padding:1px 5px;border-radius:4px}
.ok{color:var(--ok)}.ng{color:var(--ng)}
@media (max-width:640px){.wrap{padding:16px}.tplgrid{grid-template-columns:1fr}h1{font-size:22px}}

.webnote{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:.95}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

function geminiSchema() {

    const val = it.kind === "enum" ? { type: "STRING", enum: it.options.concat(it.reserved) } : { type: "STRING" };
    props[it.key] = { type: "OBJECT", properties: { "値": val, "根拠": { type: "STRING" } }, required: ["値", "根拠"], propertyOrdering: ["値", "根拠"] };

  if (s.gemini_thinking) gc.thinkingConfig = { thinkingLevel: s.gemini_thinking };

  if (r.status === 429) throw new LLMError("回数の上限（429）。待って再試行します。1日の上限なら翌日に「失敗した分だけ再実行」してください。", true, 20);

}

async function listModels(s) {

const TEXT_COLS = ["災害発生時の状況", "災害発生の状況", "状況", "記述", "text"];
function readTable(name, buf) {
  const wb = XLSX.read(buf, { type: "array", codepage: 932 });

  for (const sn of wb.SheetNames) { const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: null, raw: true }).slice(0, 5); if (rows.some(r => r.some(c => c != null && TEXT_COLS.includes(String(c).trim())))) { ws = sn; break; } }
  ws = ws || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[ws], { header: 1, defval: null, raw: true });
  let hi = rows.slice(0, 10).findIndex(r => r.some(c => c != null && TEXT_COLS.includes(String(c).trim())));
  if (hi < 0) hi = Math.max(0, rows.findIndex(r => r.some(c => c != null && c !== "")));
  const headers = [];
  (rows[hi] || []).forEach((c, j) => { let h = c != null && c !== "" ? String(c).trim() : `列${j + 1}`; while (headers.includes(h)) h += "_"; headers.push(h); });
  const out = [];
  for (const r of rows.slice(hi + 1)) { if (!r.some(c => c != null && c !== "")) continue; const o = {}; headers.forEach((h, j) => o[h] = j < r.length ? r[j] : null); out.push(o); }
  return { headers, rows: out, sheet: ws, name };
}

  const ws = XLSX.utils.aoa_to_sheet([heads, ...rows.map(r => r.map(v => typeof v === "number" ? Math.round(v * 1e6) / 1e6 : v))]);
  ws["!cols"] = heads.map((h, j) => ({ wch: widths[h] || Math.min(60, Math.max(8, Math.max(String(h).length * 2, ...rows.slice(0, 200).map(r => String(r[j] ?? "").length * 1.6)) + 2)) }));

  save(list) { store.set("jiko_records", list); },
  insert(rec) { const l = this.all(); const id = (l.reduce((m, r) => Math.max(m, r.id), 0) || 0) + 1; const t = nowUTC(); l.push(Object.assign({ id, created_at: t, updated_at: t }, rec)); this.save(l); return id; },
  update(id, patch) { const l = this.all(); const r = l.find(x => x.id === id); if (r) Object.assign(r, patch, { updated_at: nowUTC() }); this.save(l); },
  remove(id) { this.save(this.all().filter(r => r.id !== id)); },
  get(id) { return this.all().find(r => r.id === id); },
};

function confirmTable(result, final, other, comment, text) {
  return `<div class="scroll"><table><tr><th style="width:130px">項目</th><th>候補（修正可）</th><th style="width:150px">状態</th><th>根拠</th></tr>
  ${CFG.ITEMS.map(it => {
    const r = result[it.key] || {}; const cur = final[it.key] ?? RN;
    const input = it.kind === "enum"
      ? `<select data-k="${esc(it.key)}">${(it.reserved.concat(it.options).includes(cur) ? [] : [cur]).concat(it.reserved, it.options).map(o => `<option value="${esc(o)}" ${o === cur ? "selected" : ""}>${o === RN ? "— 記載なし" : o === RA ? "— 該当なし" : esc(o)}</option>`).join("")}</select>`
      : `<input type="text" data-k="${esc(it.key)}" value="${esc(cur)}" style="width:100%" maxlength="120">`;
    const otherIn = it.key === "発生場所2" ? `<div style="margin-top:6px" class="row"><span class="muted">その他の発生場所</span><input type="text" id="other" value="${esc(other || "")}" placeholder="例：校門横の自転車置き場"></div>` : "";
    const hint = r.ai_value && r.ai_value !== cur && r.status === ST.REJECT ? `<div class="muted">AIの答え：${esc(r.ai_value)}（記述に根拠が見つからないため除外）</div>` : "";
    return `<tr><th>${esc(it.key)}</th><td>${input}${otherIn}${hint}</td><td>${r.status ? `<span class="st st-${esc(r.status)}">${esc(r.status)}</span>` : ""}</td><td>${esc(r.evidence || "")}</td></tr>`;
  }).join("")}
  <tr><th>災害発生時の状況</th><td colspan="3" style="white-space:pre-wrap">${esc(text)}</td></tr>
  <tr><th>コメント<br>（任意）</th><td colspan="3"><textarea id="comment" style="min-height:60px" placeholder="テスト時の気づきなど（空欄でも保存できます）">${esc(comment || "")}</textarea></td></tr></table></div>`;
}
const readFinal = () => Object.fromEntries([...document.querySelectorAll("[data-k]")].map(el => [el.dataset.k, el.value.trim() || RN]));

  V.innerHTML = `<h2>確認画面</h2>
  ${Object.keys(miss).length ? `<div class="hint"><b>記述から読み取れなかった項目</b>（書き足すとよいテンプレ欄）：${Object.entries(miss).map(([t, ks]) => `<br>【${esc(t)}】… ${esc(ks.join("、"))}`).join("")}</div>` : ""}
  ${confirmTable(P.result, final, "", "", P.text)}
  <p class="muted">モデル：${esc(P.meta.model)}／${esc(P.meta.prompt_version)}／${P.meta.elapsed_sec}秒。状態の意味：原文明記＝値を裏付ける語が記述にある／推定＝記述に裏付けの語がなく文脈から推定した値（要確認）／規則で補完＝他の項目から規則で決めた／要確認＝規則・要約による候補／検証で除外＝AIの答えに根拠がなく記載なしに戻した。</p>
  <p><label><input type="checkbox" id="ck"> 全項目を確認しました</label></p>

  <p class="muted">＊チェックを入れて保存したときだけDBに保存されます。それ以外で画面を切り替えた場合は保存されません。</p>`;
  $("#ck").onchange = () => $("#save").disabled = !$("#ck").checked;

  ${!U ? `<div class="grid"><div class="card"><h3>Excel / CSV を読み込む</h3><p class="muted">例：学校等事故事例検索データベースの障害見舞金Excel（「災害発生時の状況」列）。種別で「歯牙障害」に絞り込めます。</p>
   <input type="file" id="jf" accept=".xlsx,.xlsm,.csv"><p><button class="btn" id="jl">読み込む</button></p></div>
   <div class="card"><h3>DBの記録を使う</h3><p class="muted">新規登録で確定保存した ${DB.all().length} 件。構造化項目は人が確認した確定値を使います。</p><a class="btn o" href="#jaccard/db">DBの記録で解析</a></div></div>` : `
  <div class="card"><p><b>${esc(U.name)}</b>（${U.rows.length}行） <a href="#" id="jother" class="muted">別のファイル</a></p>
   <div class="row"><label>記述の列 <select id="jtc">${U.headers.map(h => `<option ${h === tc ? "selected" : ""}>${esc(h)}</option>`).join("")}</select></label>
   <label>絞り込み <select id="jfc"><option value="">（しない）</option>${U.headers.map(h => `<option ${F.filter_col === h ? "selected" : ""}>${esc(h)}</option>`).join("")}</select></label>
   <label>＝ <input type="text" id="jfv" value="${esc(F.filter_val || "")}" placeholder="例：歯牙障害"></label></div>
   <h3>構造化項目（列＝値 を特徴にする）</h3><div class="row">${U.headers.filter(h => h !== tc).map(h => `<label style="white-space:nowrap"><input type="checkbox" class="jst" value="${esc(h)}" ${sg.includes(h) ? "checked" : ""}> ${esc(h)}</label>`).join("")}</div>
   <h3>原文語（記述に含まれるかを見る語）</h3><input type="text" id="jfo" value="${esc(F.focus)}" style="width:100%">
   <h3>辞書カテゴリ（1行に「カテゴリ名: 語, 語, …」）</h3><textarea id="jdi" style="min-height:170px;font-family:monospace">${esc(F.dict)}</textarea>
   <p class="muted">既定の辞書は例です。抄録で使った辞書がある場合は、それに置き換えてください（結果は辞書の中身で変わります）。</p>
   <div class="row"><label>形態素の上位語 <input type="number" id="jtn" value="${F.topn}" min="0" max="200" style="width:80px"> 語</label>
   <label>品詞：${["名詞", "動詞", "形容詞"].map(p => `<input type="checkbox" class="jpos" value="${p}" ${F.pos.includes(p) ? "checked" : ""}>${p} `).join("")}</label>
   <label>Jaccardに使う最少事例数 <input type="number" id="jmc" value="${F.min_count}" min="1" style="width:80px"></label></div>
   <details><summary>除外語（上位語から除く）</summary><textarea id="jsw" style="min-height:70px">${esc(F.stop)}</textarea></details>
   <button class="btn big" id="jrun">解析する</button> <span class="muted hidden" id="jwait">形態素解析中…（初回は辞書の読み込みに数秒〜十数秒）</span></div>`}
  <div id="jout">${JRES && U && JRES.upload === U ? jresHTML(JRES) : ""}</div>`;
  if (!U) {
    $("#jl").onclick = async () => { try { UPLOAD.jac = await pickFile($("#jf")); JRES = null; vJaccard([]); } catch (e) { flash(e.message || "読み込めませんでした。", true); } };
    return;
  }
  $("#jother").onclick = e => { e.preventDefault(); UPLOAD.jac = null; JRES = null; location.hash = "#jaccard"; vJaccard([]); };
  $("#jrun").onclick = async () => {
    $("#jrun").disabled = true; $("#jwait").classList.remove("hidden");
    const form = { text_col: $("#jtc").value, filter_col: $("#jfc").value, filter_val: $("#jfv").value.trim(), struct: [...document.querySelectorAll(".jst:checked")].map(e => e.value),
      focus: $("#jfo").value, dict: $("#jdi").value, stop: $("#jsw").value, topn: +$("#jtn").value || 0, min_count: +$("#jmc").value || 1, pos: [...document.querySelectorAll(".jpos:checked")].map(e => e.value) };
    const tok = form.topn > 0 ? await loadKuromoji() : null;
    const docs = [];
    U.rows.forEach((r, i) => { const t = r[form.text_col]; if (t == null || String(t).trim() === "") return;
      if (form.filter_col && form.filter_val && String(r[form.filter_col] ?? "").trim() !== form.filter_val) return;
      docs.push({ id: i + 1, text: String(t), struct: Object.fromEntries(form.struct.map(c => [c, r[c]])) }); });
    await sleep(10);
    const res = analyze(docs, parseList(form.focus), parseDict(form.dict), form.struct, form.topn, new Set(form.pos.length ? form.pos : ["名詞"]), parseList(form.stop), form.min_count, !!tok);
    JRES = Object.assign(res, { form, upload: U, tokenizer: tok ? "kuromoji.js 0.1.2（IPA辞書）" : `なし（${TOK_ERR || "上位語0"}）：形態素上位語を省略`, time: nowUTC() });
    if (!tok && form.topn > 0) flash("形態素解析の辞書を読み込めませんでした。原文語・辞書カテゴリ・構造化項目だけで計算しました。" + (TOK_ERR ? `（${TOK_ERR}）` : ""), true);
    vJaccard([]);
  };
}
function jresHTML(R) {
  const byType = t => R.pairs.filter(p => p.type === t).slice(0, 15);
  return `<h2>結果（${R.n}件）</h2><p class="muted">形態素解析：${esc(R.tokenizer)}</p><p><button class="btn" id="jx" onclick="jaccardExcel()">Excelに書き出す（特徴・全ペア・行列・事例×特徴・設定）</button></p>
  ${[["原文語―対応カテゴリ", "原文語と対応する辞書カテゴリ（集約に伴う重複の大きさ）"], ["異なる特徴間", "異なる特徴間（場面・原因物・受傷機転の組み合わせ）"], ["構造化項目を含む", "構造化項目とテキスト特徴"]].map(([t, label]) => { const ps = byType(t); return ps.length ? `<h3>${label}：Jaccard上位</h3><div class="scroll"><table data-type="${t}">
  <tr><th>特徴A</th><th>特徴B</th><th class="num">A</th><th class="num">B</th><th class="num">A∩B</th><th class="num">A∪B</th><th class="num">Jaccard</th><th class="num">P(B|A)</th><th class="num">P(A|B)</th></tr>
  ${ps.map(p => `<tr><td>${esc(p.a)}</td><td>${esc(p.b)}</td><td class="num">${p.n_a}</td><td class="num">${p.n_b}</td><td class="num">${p.inter}</td><td class="num">${p.union}</td><td class="num"><b>${f3(p.jaccard)}</b></td><td class="num">${f3(p.pba)}</td><td class="num">${f3(p.pab)}</td></tr>`).join("")}</table></div>` : ""; }).join("")}
  <p class="muted">Jaccardは対称で、件数の差が大きい組では小さく出る。小さい側から見た重なりは P(B|A)・P(A|B) を併せて見る。</p>
  <h3>Jaccard行列（件数上位${R.mf.length}特徴）</h3><div class="scroll"><table class="heat"><tr><th></th>${R.mf.map(f => `<th class="v">${esc(f)}</th>`).join("")}</tr>
  ${R.mf.map((a, i) => `<tr><th>${esc(a)}</th>${R.matrix[i].map((v, j) => `<td style="background:rgba(61,90,241,${(v * 0.85).toFixed(2)});color:${v > 0.55 ? "#fff" : "#1f2328"}">${i === j ? "—" : v.toFixed(2)}</td>`).join("")}</tr>`).join("")}</table></div>
  <h3>特徴の出現（事例数・割合）</h3><div class="scroll"><table style="max-width:760px" id="jfeat"><tr><th>特徴</th><th>種類</th><th class="num">事例数</th><th class="num">割合%</th><th>Jaccardに使用</th></tr>
  ${R.features.map(f => `<tr><td>${esc(f.name)}</td><td>${esc(f.type)}</td><td class="num">${f.count}</td><td class="num">${f.pct.toFixed(1)}</td><td>${f.used ? "○" : ""}</td></tr>`).join("")}</table></div>`;
}
function jaccardExcel() {
  const R = JRES, f = R.form, wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetFrom(["特徴", "種類", "事例数", "割合(%)", "Jaccard計算に使用"], R.features.map(x => [x.name, x.type, x.count, x.pct, x.used ? "○" : ""])), "特徴");
  XLSX.utils.book_append_sheet(wb, sheetFrom(["特徴A", "特徴B", "組の種類", "Aの事例数", "Bの事例数", "共通(A∩B)", "和集合(A∪B)", "Jaccard", "P(B|A)", "P(A|B)"], R.pairs.map(p => [p.a, p.b, p.type, p.n_a, p.n_b, p.inter, p.union, p.jaccard, p.pba, p.pab])), "ペア");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["", ...R.mf], ...R.mf.map((a, i) => [a, ...R.matrix[i].map(v => Math.round(v * 1000) / 1000)])]), "行列");
  XLSX.utils.book_append_sheet(wb, sheetFrom(["元の行", ...R.caseMatrix.features], R.caseMatrix.rows.map((r, i) => [R.caseMatrix.ids[i], ...r])), "事例×特徴");
  const ws = XLSX.utils.aoa_to_sheet([["元データ", R.upload.name], ["記述の列", f.text_col], ["対象事例数", R.n], ["絞り込み", f.filter_col && f.filter_val ? `${f.filter_col}=${f.filter_val}` : "なし"], ["構造化項目", f.struct.join("、")],
    ["形態素解析", R.tokenizer], ["品詞", f.pos.join("、")], ["上位語の数", f.topn], ["最少事例数", f.min_count], ["原文語", f.focus], ["辞書カテゴリ", f.dict], ["除外語", f.stop], ["実行日時(UTC)", R.time],
    ["Jaccard", "|A∩B| / |A∪B|（A,B＝その特徴を持つ事例の集合）"], ["原文語・カテゴリの判定", "記述（NFKC正規化）に語が部分文字列として含まれるか"], ["形態素上位語の判定", "kuromoji.jsで分かち書きした基本形に含まれるか"]]);
  ws["!cols"] = [{ wch: 18 }, { wch: 100 }]; XLSX.utils.book_append_sheet(wb, ws, "設定");
  download(wb, "jaccard.xlsx");
}

/* ---------------- 設定 ---------------- */
function vSettings() {
  const s = settings(), saved = !!store.get("jiko_key", "");
  V.innerHTML = `<h2>設定</h2><div class="card" style="max-width:820px">
  <div class="notice">記述がGoogleに送られます。<b>無料枠では送った内容が製品改善に使われ、人が読むこともあります。</b>公開データと架空の症例だけを使ってください。利用は18歳以上。</div>
  <p><label>Gemini APIキー（<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>で作成）<br>
   <input type="password" id="key" style="width:100%" autocomplete="off" placeholder="${s.key ? "入力済み（末尾 …" + esc(s.key.slice(-4)) + "）。変えるときだけ入力" : "AIza…"}"></label></p>
  <p><label><input type="checkbox" id="keep" ${saved ? "checked" : ""}> この端末に保存する（共有PCではオフ。オフならこのタブを閉じると消えます）</label>
   ${s.key ? ` <button class="btn o sm" id="forget">キーを消す</button>` : ""}</p>
  <p class="muted">キーはこのブラウザの中にだけ保存され、Gemini API以外には送りません。ページには埋め込みません。</p>
  <p><label>モデル<br><input type="text" id="model" value="${esc(s.gemini_model)}" list="mlist" style="width:320px"></label><datalist id="mlist"></datalist>
   <span class="muted">研究では安定版を固定（preview版は途中で仕様が変わる）</span></p>
  <div class="row"><label>思考レベル <select id="think">${[["low", "low（既定・最小）"], ["minimal", "minimal（対応モデルのみ）"], ["medium", "medium"], ["high", "high"], ["", "指定しない（モデルの既定）"]].map(([v, l]) => `<option value="${v}" ${s.gemini_thinking === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
   <label>呼び出し間隔（秒） <input type="number" id="intv" value="${s.interval_sec}" min="0" max="120" step="0.5" style="width:90px"></label></div>
  <p class="muted">思考トークンも出力として課金されます。受け付けられない設定（seed・思考レベル）はAPIが拒否した場合だけ外して再送し、結果Excelの「外した設定」に記録します。研究条件として固定：温度 ${s.temperature}、seed ${s.seed}、プロンプト版 ${CFG.PROMPT_VERSION}。</p>
  <div class="row"><button class="btn" id="save">保存</button><button class="btn o" id="load">モデル一覧を取得</button><button class="btn o" id="test">接続テスト（サンプル1件を分類）</button></div>
  <pre id="out" class="muted" style="white-space:pre-wrap"></pre></div>
  <details><summary>AIへの指示（システムプロンプト ${CFG.PROMPT_VERSION}）</summary><pre style="white-space:pre-wrap">${esc(CFG.SYSTEM)}</pre></details>
  <details><summary>分類項目と選択肢</summary><table>${CFG.ITEMS.map(it => `<tr><th style="width:120px">${esc(it.key)}</th><td>${it.kind === "enum" ? esc(it.options.join("／")) : "<i>記述から抜き出し（30字以内）</i>"}<div class="muted">テンプレ欄：${esc(it.tpl || "なし（対照項目）")}${it.primary ? "／主要解析の対象" : ""}</div></td></tr>`).join("")}</table>
  <p class="muted">全項目共通の予約語：記載なし（記述から読めない）・該当なし（その場面ではない）。定義は Python版の config.py から生成しています。</p></details>`;
  const save = () => {
    const k = $("#key").value.trim(), keep = $("#keep").checked;
    const cur = store.get("jiko_key", "") || SESSION_KEY; const key = k || cur;
    if (keep && key) { store.set("jiko_key", key); SESSION_KEY = ""; } else { store.del("jiko_key"); SESSION_KEY = key; }
    store.set("jiko_settings", { gemini_model: $("#model").value.trim() || CFG.WEB_DEFAULTS.gemini_model, gemini_thinking: $("#think").value, interval_sec: Math.max(0, +$("#intv").value || 0) });
    $("#key").value = ""; $("#engine").textContent = engineLabel();
  };
  $("#save").onclick = () => { save(); toast("設定を保存しました"); vSettings(); };
  if ($("#forget")) $("#forget").onclick = () => { store.del("jiko_key"); SESSION_KEY = ""; toast("キーを消しました"); vSettings(); };
  $("#load").onclick = async () => { save(); const o = $("#out"); o.textContent = "取得中…"; try { const ms = await listModels(settings()); $("#mlist").innerHTML = ms.map(m => `<option value="${esc(m)}">`).join(""); o.textContent = "取得：" + ms.join("、"); } catch (e) { o.textContent = e.message; } };
  $("#test").onclick = async () => { save(); const o = $("#out"); o.textContent = "テスト中…";
    const sample = "中学2年の男子生徒が、放課後の部活動でバスケットボールの練習中、相手選手の頭が口元に当たり、上顎前歯を破折した。";
    try { const [raw, meta] = await classify(sample, settings()); const post = postprocess(sample, raw);
      o.textContent = `成功（${meta.model}、${meta.elapsed_sec}秒${meta.dropped ? "、外した設定：" + meta.dropped : ""}）\n` + Object.entries(post).map(([k, v]) => `${k}：${v.value}（${v.status}）`).join("\n");
    } catch (e) { o.textContent = "失敗：" + e.message; } };
}

route();
